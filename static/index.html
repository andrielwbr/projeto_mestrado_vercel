<body>

<div class="main-card">
    <div class="text-center mb-2">
        <i class="fas fa-running fa-2x" style="color: #fa4299;"></i>
    </div>
    <h3 class="title">RunAI Coach</h3>

    <form onsubmit="event.preventDefault(); enviar();">
       
        <div class="mb-3">
            <label>SEU E-MAIL (Login)</label>
            <input type="email" id="user_email" class="form-control" placeholder="ex: seu.email@gmail.com" required>
        </div>

        <div class="mb-3 mt-3">
            <label>SEU NICKNAME</label>
            <input type="text" id="user_id" class="form-control" placeholder="Ex: andriel" required>
        </div>

        <div class="mb-3">
            <label>DATA DO TREINO</label>
            <input type="date" id="data_treino" class="form-control" style="color: #666; font-weight: bold;" required>
        </div>

        <div class="mb-3 mt-3">
            <label>TIPO DE ATIVIDADE</label>
            <select id="tipo_atividade" class="form-select" onchange="atualizarNiveis()">
                <option value="corrida" selected>🏃 Corrida</option>
                <option value="caminhada">🚶 Caminhada</option>
            </select>
        </div>

        <div class="row g-2">
            <div class="col-6">
                <label>IDADE</label>
                <input type="number" id="idade" class="form-control" placeholder="Anos" required>
            </div>
            <div class="col-6">
                <label>Nível</label>
                <select id="nivel" class="form-select">
                    <option value="iniciante">Iniciante</option>
                    <option value="avancado">Já corro</option>
                </select>
            </div>
        </div>

        <div class="row g-2">
            <div class="col-6">
                <label>Distância (KM)</label>
                <input type="number" id="km" class="form-control mb-1" placeholder="0.0" step="0.1" max="100" required>
            </div>
            <div class="col-6">
                <label>Tempo (Min)</label>
                <input type="number" id="tempo" class="form-control mb-1" placeholder="0" max="600" required>
            </div>
        </div>

        <div class="mb-4 mt-2">
            <label>Sensação de Esforço: <span id="valEsforco" style="color: #fa4299; font-weight:bold; font-size: 16px;">5/10</span></label>
            <input type="range" class="form-range" min="0" max="10" value="5" id="esforco" oninput="atualizarEsforco(this.value)">
            
            <div id="descEsforcoBox" style="background: #f8f9fa; border-left: 4px solid #f59e0b; padding: 12px 15px; border-radius: 8px; margin-top: 5px; display: block;">
                <strong id="tituloEsforco" style="color: #f59e0b; font-size: 12px; text-transform: uppercase;">Moderado</strong>
                <p id="textoEsforco" style="font-size: 11px; color: #666; margin: 4px 0 0 0;">
                    Conseguia falar por pouco tempo.<br>Respiração com maior dificuldade.
                </p>
            </div>
        </div>

        <button type="submit" id="btnEnviar" class="btn-gradient">ANALISAR PERFORMANCE</button>
    </form>
    
    <div id="resultado" class="mt-4 p-3 rounded" style="display: none; background: #f8f9fa; border: 1px solid #ddd;"></div>

    <div class="text-center mt-2">
        <a href="#" id="btnToggleDetalhes" style="display: none; color: #666; font-size: 13px; text-decoration: underline;" onclick="toggleDetalhes(event)">Ocultar análise</a>
    </div>

    <div id="blocoFeedback" class="mt-4 text-center p-3 rounded" style="display: none; background: #e0f2fe; border: 1px dashed #38bdf8;">
        <p class="mb-2" style="font-size: 14px; font-weight: bold; color: #0369a1;">🧠 Como seu corpo reagiu a este treino?</p>
        <div class="d-flex justify-content-center gap-2">
            <button onclick="enviarFeedback('Excelente (Sem dores)')" class="btn btn-sm" style="background: #16a34a; color: white; border-radius: 20px;">🟢 Excelente</button>
            <button onclick="enviarFeedback('Cansado (Fadiga normal)')" class="btn btn-sm" style="background: #f59e0b; color: white; border-radius: 20px;">🟡 Cansado</button>
            <button onclick="enviarFeedback('Com Dor (Sinal de lesão)')" class="btn btn-sm" style="background: #dc2626; color: white; border-radius: 20px;">🔴 Com Dor</button>
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const campoData = document.getElementById('data_treino');
        const hoje = new Date();
        campoData.value = hoje.toISOString().split('T')[0];
        if(localStorage.getItem('run_email')) document.getElementById('user_email').value = localStorage.getItem('run_email');
        if(localStorage.getItem('run_user')) document.getElementById('user_id').value = localStorage.getItem('run_user');
        if(localStorage.getItem('run_age')) document.getElementById('idade').value = localStorage.getItem('run_age');
    });

    function atualizarNiveis() {
        const tipo = document.getElementById('tipo_atividade').value;
        const selectNivel = document.getElementById('nivel');
        selectNivel.innerHTML = (tipo === 'caminhada') 
            ? `<option value="iniciante">Iniciante</option><option value="avancado">Já faço caminhadas</option>`
            : `<option value="iniciante">Iniciante</option><option value="avancado">Já corro</option>`;
    }

    function atualizarEsforco(valor) {
        document.getElementById('valEsforco').innerText = valor + "/10";
        const titulo = document.getElementById('tituloEsforco');
        const texto = document.getElementById('textoEsforco');
        valor = parseInt(valor);
        if (valor <= 3) { titulo.innerText = "Confortável"; titulo.style.color = "#16a34a"; texto.innerHTML = "Respiração normal. Muito confortável."; }
        else if (valor <= 6) { titulo.innerText = "Moderado"; titulo.style.color = "#f59e0b"; texto.innerHTML = "Dentro da zona de conforto."; }
        else { titulo.innerText = "Alto/Máximo"; titulo.style.color = "#dc2626"; texto.innerHTML = "Respiração pesada. No seu limite."; }
    }

    function toggleDetalhes(event) {
        event.preventDefault();
        const divRes = document.getElementById('resultado');
        divRes.style.display = (divRes.style.display === 'none') ? 'block' : 'none';
    }

    async function enviar() {
        const btn = document.getElementById('btnEnviar');
        btn.innerText = "CALCULANDO..."; btn.disabled = true;

        localStorage.setItem('run_email', document.getElementById('user_email').value);
        localStorage.setItem('run_user', document.getElementById('user_id').value);
        localStorage.setItem('run_age', document.getElementById('idade').value);

        const dados = {
            email: document.getElementById('user_email').value.toLowerCase().trim(), 
            user_id: document.getElementById('user_id').value,
            data_treino: document.getElementById('data_treino').value,
            tipo_atividade: document.getElementById('tipo_atividade').value,
            idade: parseInt(document.getElementById('idade').value),
            nivel: document.getElementById('nivel').value,
            km: parseFloat(document.getElementById('km').value),
            tempo: parseFloat(document.getElementById('tempo').value),
            esforco: parseInt(document.getElementById('esforco').value),
            clima: "Indefinido"
        };
        
        try {
            const req = await fetch('/api/registrar_treino', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            });
            
            const texto = await req.text();
            let res = JSON.parse(texto);

            if (!req.ok || res.erro) {
                alert("⚠️ " + (res.erro || res.detail));
                return;
            }
            
            const divRes = document.getElementById('resultado');
            divRes.style.display = 'block';
            let corStatus = res.analise.status.includes('🔴') ? "#dc2626" : (res.analise.status.includes('🟢') ? "#16a34a" : "#f59e0b");

            divRes.innerHTML = `
                <div style="text-align: left;">
                    <h5 style="font-weight: bold; color: ${corStatus};">${res.analise.status}</h5>
                    <p style="font-size: 14px; margin-bottom: 5px;">${res.analise.mensagem}</p>
                    <p style="font-size: 14px; margin-bottom: 15px;"><strong>RECOMENDAÇÃO:</strong> ${res.analise.acao}</p>
                    <div style="background: #e0f2fe; padding: 12px; border-radius: 8px; border-left: 4px solid #0284c7;">
                        <p style="font-size: 16px; font-weight: bold; color: #0284c7; margin-bottom: 0;">🎯 ${res.analise.proximo_treino}</p>
                    </div>
                </div>`;

            document.getElementById('btnToggleDetalhes').style.display = "inline-block";
            document.getElementById('blocoFeedback').style.display = "block"; 
            divRes.scrollIntoView({behavior: 'smooth', block: 'end'});
        } catch (e) {
            alert("Erro de conexão: " + e);
        } finally {
            btn.innerText = "ANALISAR PERFORMANCE"; btn.disabled = false;
        }
    }

    async function enviarFeedback(nota) {
        const email = document.getElementById('user_email').value.toLowerCase().trim();
        const dataTreino = document.getElementById('data_treino').value;
        const bloco = document.getElementById('blocoFeedback');
        
        bloco.innerHTML = `<p class="mt-2 mb-0" style="color: #f59e0b; font-weight: bold;">⏳ Salvando...</p>`;

        try {
            const req = await fetch('/api/registrar_feedback', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: email, data_treino: dataTreino, feedback: nota })
            });
            
            if (req.ok) {
                bloco.innerHTML = `<p class="mt-2 mb-0" style="color: #16a34a; font-weight: bold;">✅ Feedback salvo com sucesso!</p>`;
            } else {
                const txt = await req.text();
                bloco.innerHTML = `<p class="mt-2 mb-0" style="color: #dc2626; font-weight: bold;">❌ Erro: ${txt}</p>`;
            }
        } catch (e) {
            bloco.innerHTML = `<p class="mt-2 mb-0" style="color: #dc2626;">❌ Erro de conexão.</p>`;
        }
    }
</script>
</body>
</html>
